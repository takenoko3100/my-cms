<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self' https://cdn.jsdelivr.net;
      connect-src 'self' https://cshieomhxpuaclggicle.supabase.co wss://cshieomhxpuaclggicle.supabase.co;
      img-src 'self' data: blob:;
      style-src 'self' 'unsafe-inline';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
    "
  >

  <title>パスワード再設定 | sasulie</title>

  <style>
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      color: #30372d;
      background: #f6f5f0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;
      line-height: 1.8;
    }

    main {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    .reset-card {
      width: 100%;
      max-width: 460px;
      padding: 36px 30px;
      background: #fff;
      border: 1px solid #e1e5db;
      border-radius: 24px;
      box-shadow: 0 16px 48px rgba(48, 55, 45, .05);
    }

    .brand {
      margin: 0 0 24px;
      color: #40543e;
      font: 36px/1.2 Georgia, serif;
      letter-spacing: 2px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 23px;
      line-height: 1.5;
    }

    .lead,
    .hint,
    .footer {
      color: #62695e;
    }

    .lead {
      margin: 0 0 26px;
      font-size: 14px;
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .input-wrap {
      position: relative;
    }

    input {
      display: block;
      width: 100%;
      min-height: 54px;
      padding: 13px 58px 13px 14px;
      border: 1px solid #cbd2c5;
      border-radius: 12px;
      background: #fff;
      color: #30372d;
      font: inherit;
      font-size: 16px;
    }

    input[aria-invalid="true"] {
      border-color: #a33a32;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .eye {
      position: absolute;
      top: 50%;
      right: 5px;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #40543e;
    }

    .eye:hover {
      background: #eff2eb;
    }

    .eye svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
    }

    .eye .slash {
      display: none;
    }

    .eye[aria-pressed="true"] .slash {
      display: block;
    }

    :focus-visible {
      outline: 3px solid #71886b;
      outline-offset: 3px;
    }

    .hint {
      margin: 8px 0 0;
      font-size: 12px;
    }

    .primary {
      display: block;
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 12px;
      background: #40543e;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
    }

    .primary:hover {
      background: #30422f;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      margin: 0 0 20px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    .message.error {
      background: #fff1ee;
      color: #8b3029;
    }

    .message.success {
      background: #edf4e9;
      color: #344c30;
    }

    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #40543e;
      font-size: 13px;
      text-underline-offset: 4px;
    }

    .footer {
      margin: 28px 0 0;
      text-align: center;
      font-size: 11px;
      letter-spacing: .04em;
    }

    @media (max-width: 380px) {
      .reset-card {
        padding: 28px 20px;
      }

      h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="reset-card" aria-labelledby="resetTitle">
      <p class="brand">sasulie</p>

      <h1 id="resetTitle">パスワードの再設定</h1>

      <p class="lead">
        管理画面で使う、新しいパスワードを設定してください。
      </p>

      <p
        id="errorMessage"
        class="message error"
        role="alert"
        hidden
      ></p>

      <p
        id="successMessage"
        class="message success"
        role="status"
        hidden
      ></p>

      <form id="resetPasswordForm" novalidate>
        <div class="field">
          <label for="newPassword">
            新しいパスワード
          </label>

          <div class="input-wrap">
            <input
              type="password"
              id="newPassword"
              autocomplete="new-password"
              minlength="8"
              required
              aria-describedby="passwordHint"
            >

            <button
              type="button"
              class="eye"
              data-password-target="newPassword"
              aria-label="新しいパスワードを表示"
              aria-controls="newPassword"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
                <path class="slash" d="M3 3l18 18"/>
              </svg>
            </button>
          </div>

          <p class="hint" id="passwordHint">
            8文字以上で設定してください。
          </p>
        </div>

        <div class="field">
          <label for="confirmPassword">
            新しいパスワード（確認）
          </label>

          <div class="input-wrap">
            <input
              type="password"
              id="confirmPassword"
              autocomplete="new-password"
              minlength="8"
              required
              aria-describedby="confirmHint"
            >

            <button
              type="button"
              class="eye"
              data-password-target="confirmPassword"
              aria-label="確認用パスワードを表示"
              aria-controls="confirmPassword"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
                <path class="slash" d="M3 3l18 18"/>
              </svg>
            </button>
          </div>

          <p class="hint" id="confirmHint">
            同じパスワードをもう一度入力してください。
          </p>
        </div>

        <button
          type="submit"
          class="primary"
          id="updatePasswordButton"
        >
          パスワードを変更
        </button>
      </form>

      <a id="loginLink" class="back" href="/login.html">
        ログイン画面へ戻る
      </a>

      <p class="footer">
        sasulie ｜ ホームページ管理サービス
      </p>

      <noscript>
        <p>
          この画面を利用するにはJavaScriptを有効にしてください。
        </p>
      </noscript>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="reset-password.js?v=2"></script>
</body>
</html>
