<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>たけのこレストラン</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>たけのこレストラン</h1>
    <p>愛知県知立市のレストラン

    </p>
  </header>

 <main>

  <div id="toastMessage" class="toast-message"></div>

  <nav class="admin-tabs">
  <button class="tab-button active" data-tab="news">お知らせ</button>
  <button class="tab-button" data-tab="company">会社情報</button>
  <button class="tab-button" data-tab="menu">メニュー</button>
</nav>

<section class="dashboard-summary">

  <div class="summary-card">
    <span class="summary-label">お知らせ</span>
    <strong id="newsCount">0件</strong>
  </div>

  <div class="summary-card">
    <span class="summary-label">メニュー</span>
    <strong id="menuCount">0件</strong>
  </div>

  <div class="summary-card">
    <span class="summary-label">最終更新</span>
    <strong id="lastUpdated">-</strong>
  </div>

</section>

  <section class="admin-actions">
  <a href="site.html" target="_blank" class="preview-button">
    公開ページを見る
  </a>

  <button id="logoutButton">ログアウト</button>
</section>

  <section class="admin tab-content" data-tab-content="news">
    <h2>お知らせを追加</h2>

    <input type="text" id="title" placeholder="タイトル">

    <textarea id="content" placeholder="お知らせの内容"></textarea>

<input type="file" id="image" accept="image/*">

<button onclick="addNews()">公開する</button>
  </section>

  <section class="tab-content" data-tab-content="news">
  <h2>お知らせ</h2>
    <div id="newsList"></div>
  </section>

  <section class="company-info tab-content" data-tab-content="company">
  <h2>会社情報</h2>

  <input type="text" id="companyName" placeholder="会社名・店舗名">

  <input type="text" id="companyAddress" placeholder="住所">

<textarea id="companyDescription" placeholder="店舗紹介文"></textarea>

<input type="text" id="companyPhone" placeholder="電話番号">

<input type="url" id="companyInstagram" placeholder="Instagram URL">

  <input type="text" id="companyHours" placeholder="営業時間">

  <input type="text" id="companyClosedDays" placeholder="定休日">

<label for="heroImage">トップ画像</label>
<input type="file" id="heroImage" accept="image/*">

<button id="saveCompanyInfo">会社情報を保存</button>
</section>

<section class="menu-admin tab-content" data-tab-content="menu">
  <h2>メニュー追加</h2>

  <input type="text" id="menuName" placeholder="メニュー名">

  <textarea id="menuDescription" placeholder="メニュー説明"></textarea>

  <input type="number" id="menuPrice" placeholder="価格">

  <input type="file" id="menuImage" accept="image/*">

  <button id="addMenuButton">メニューを追加</button>
</section>

<section class="tab-content" data-tab-content="menu">
  <h2>登録済みメニュー</h2>
  <div id="menuList"></div>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
