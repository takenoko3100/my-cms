<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self' https://cdn.jsdelivr.net;
      connect-src 'self' https://cshieomhxpuaclggicle.supabase.co wss://cshieomhxpuaclggicle.supabase.co;
      img-src 'self' data: blob: https://cshieomhxpuaclggicle.supabase.co;
      style-src 'self' 'unsafe-inline';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
    "
  >

  <title>かんたん編集 | たけのこCMS</title>

  <link rel="stylesheet" href="editor.css?v=3">
</head>

<body>

  <div
    id="toastMessage"
    class="toast-message"
    aria-live="polite"
  ></div>

  <header class="editor-topbar">

    <div class="editor-topbar-inner">

      <div>
        <p class="editor-eyebrow">
          TAKENOKO CMS
        </p>

        <h1>
          かんたん編集
        </h1>

        <p class="editor-help">
          変更したい場所をタップしてください
        </p>
      </div>

      <div class="topbar-actions">

        <a
          href="site.html"
          target="_blank"
          rel="noopener"
          class="secondary-action"
        >
          公開ページ
        </a>

        <button
          id="logoutButton"
          type="button"
          class="secondary-action"
        >
          ログアウト
        </button>

      </div>

    </div>

  </header>

  <main class="editor-page">

    <section class="editor-status">

      <div>

        <span class="status-dot"></span>

        <strong>
          編集モード
        </strong>

      </div>

      <p>
        タップした場所だけ編集できます
      </p>

    </section>


    <!-- =========================
         ヒーロー
    ========================== -->

    <section
      class="visual-section visual-hero"
      id="editorHero"
    >

      <input
        type="file"
        id="heroImageInput"
        accept="image/*"
        hidden
      >

      <button
        type="button"
        id="editHeroImageButton"
        class="image-edit-button"
        aria-label="トップ画像を変更"
      >
        📷 画像を変更
      </button>

      <div class="hero-overlay">

        <button
          type="button"
          class="inline-edit-button hero-title-button"
          data-company-field="name"
        >

          <span id="editorCompanyName">
            店舗名
          </span>

        </button>

        <button
          type="button"
          class="inline-edit-button hero-address-button"
          data-company-field="address"
        >

          <span id="editorCompanyAddress">
            住所
          </span>

        </button>

      </div>

    </section>


    <!-- =========================
         店舗紹介
    ========================== -->

    <section class="visual-section content-section">

      <div class="section-heading">

        <div>

          <p class="section-label">
            INTRODUCTION
          </p>

          <h2 id="companyIntroTitle">
  店舗紹介
</h2>

        </div>

        <button
          type="button"
          class="round-edit-button"
          data-company-field="description"
          aria-label="店舗紹介を編集"
        >
          ✏️
        </button>

      </div>

      <button
        type="button"
        class="editable-block"
        data-company-field="description"
      >

        <span id="editorCompanyDescription">
          店舗紹介文を入力してください
        </span>

      </button>

    </section>


    <!-- =========================
         メニュー
    ========================== -->

    <section class="visual-section content-section">

      <div class="section-heading">

        <div>

          <p class="section-label" id="serviceSectionLabel">
  MENU
</p>

<h2 id="serviceSectionTitle">
  メニュー
</h2>

        </div>

        <button
          type="button"
          id="addMenuQuickButton"
          class="add-button"
        >
          ＋ 追加
        </button>

      </div>

      <p class="section-guide" id="serviceSectionGuide">
  料理をタップすると編集できます
</p>

      <div
        id="visualMenuList"
        class="visual-menu-list"
      ></div>

    </section>


    <!-- =========================
         店舗情報
    ========================== -->

    <section class="visual-section content-section">

      <div class="section-heading">

        <div>

          <p class="section-label">
            INFORMATION
          </p>

          <h2 id="companyInfoTitle">
  店舗情報
</h2>

        </div>

        <button
          type="button"
          class="round-edit-button"
          data-company-field="phone"
          aria-label="店舗情報を編集"
        >
          ✏️
        </button>

      </div>

      <div class="information-list">

        <button
          type="button"
          class="information-row"
          data-company-field="address"
        >

          <span>
            住所
          </span>

          <strong id="editorInfoAddress">
            -
          </strong>

          <span class="row-pencil">
            ✏️
          </span>

        </button>


        <button
          type="button"
          class="information-row"
          data-company-field="phone"
        >

          <span>
            電話番号
          </span>

          <strong id="editorInfoPhone">
            -
          </strong>

          <span class="row-pencil">
            ✏️
          </span>

        </button>


        <button
          type="button"
          class="information-row"
          data-company-field="business_hours"
        >

          <span id="businessHoursLabel">営業時間</span>

          <strong id="editorInfoHours">
            -
          </strong>

          <span class="row-pencil">
            ✏️
          </span>

        </button>


        <button
          type="button"
          class="information-row"
          data-company-field="closed_days"
        >

          <span id="closedDaysLabel">定休日</span>

          <strong id="editorInfoClosedDays">
            -
          </strong>

          <span class="row-pencil">
            ✏️
          </span>

        </button>


        <button
          type="button"
          class="information-row"
          data-company-field="instagram_url"
        >

          <span>
            Instagram
          </span>

          <strong id="editorInfoInstagram">
            未設定
          </strong>

          <span class="row-pencil">
            ✏️
          </span>

        </button>

      </div>

    </section>


    <!-- =========================
         お知らせ
    ========================== -->

    <section class="visual-section content-section">

      <div class="section-heading">

        <div>

          <p class="section-label">
            NEWS
          </p>

          <h2>
            お知らせ
          </h2>

        </div>

        <button
          type="button"
          id="addNewsQuickButton"
          class="add-button"
        >
          ＋ 追加
        </button>

      </div>

      <p class="section-guide">
        お知らせをタップすると編集できます
      </p>

      <div
        id="visualNewsList"
        class="visual-news-list"
      ></div>

    </section>

  </main>


  <!-- =========================
       店舗情報編集モーダル
  ========================== -->

  <div
    class="modal"
    id="companyModal"
    aria-hidden="true"
  >

    <div
      class="modal-backdrop"
      data-close-modal="companyModal"
    ></div>

    <section
      class="modal-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="companyModalTitle"
    >

      <div class="modal-header">

        <div>

          <p class="modal-label">
            店舗情報
          </p>

          <h2 id="companyModalTitle">
            店舗情報を編集
          </h2>

        </div>

        <button
          type="button"
          class="modal-close"
          data-close-modal="companyModal"
        >
          ×
        </button>

      </div>

      <div class="form-stack">

        <label>

          店舗名

          <input
            type="text"
            id="companyName"
            placeholder="店舗名"
          >

        </label>


        <label>

          住所

          <input
            type="text"
            id="companyAddress"
            placeholder="住所"
          >

        </label>


        <label>

          店舗紹介

          <textarea
            id="companyDescription"
            placeholder="店舗紹介文"
          ></textarea>

        </label>


        <label>

          電話番号

          <input
            type="tel"
            id="companyPhone"
            placeholder="0566-00-0000"
          >

        </label>


        <label>

          営業時間

          <input
            type="text"
            id="companyHours"
            placeholder="11:00〜21:00"
          >

        </label>


        <label>

          定休日

          <input
            type="text"
            id="companyClosedDays"
            placeholder="火曜日"
          >

        </label>


        <label>

          Instagram URL

          <input
            type="url"
            id="companyInstagram"
            placeholder="https://www.instagram.com/..."
          >

        </label>

      </div>

      <button
        type="button"
        id="saveCompanyInfo"
        class="primary-action"
      >
        保存する
      </button>

    </section>

  </div>


  <!-- =========================
       メニュー編集モーダル
  ========================== -->

  <div
    class="modal"
    id="menuModal"
    aria-hidden="true"
  >

    <div
      class="modal-backdrop"
      data-close-modal="menuModal"
    ></div>

    <section
      class="modal-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="menuModalTitle"
    >

      <div class="modal-header">

        <div>

          <p class="modal-label" id="menuModalLabel">
  MENU
</p>

<h2 id="menuModalTitle">
  メニューを追加
</h2>

        </div>

        <button
          type="button"
          class="modal-close"
          data-close-modal="menuModal"
        >
          ×
        </button>

      </div>

      <input
        type="hidden"
        id="menuEditId"
      >

      <div class="form-stack">

        <label>
  <span id="menuNameLabel">メニュー名</span>

  <input
    type="text"
    id="menuName"
    placeholder="デミグラスオムライス"
  >
</label>


        <label>

          説明

          <textarea
            id="menuDescription"
            placeholder="メニュー説明"
          ></textarea>

        </label>


        <div class="form-grid">

          <<label id="menuPriceField">
  <span id="menuPriceLabel">価格</span>

  <input
    type="number"
    id="menuPrice"
    inputmode="numeric"
    placeholder="1280"
  >
</label>


          <label>

            並び順

            <input
              type="number"
              id="menuSortOrder"
              inputmode="numeric"
              placeholder="1"
            >

          </label>

        </div>


        <label id="menuCategoryField">

  カテゴリ

  <input
    type="text"
    id="menuCategory"
    placeholder="メイン"
  >

</label>


        <label class="file-label">

          写真

          <input
            type="file"
            id="menuImage"
            accept="image/*"
          >

        </label>


        <div class="switch-list">

          <label class="switch-row" id="menuRecommendedField">

            <span>
              おすすめにする
            </span>

            <input
              type="checkbox"
              id="menuRecommended"
            >

          </label>


          <label class="switch-row" id="menuSoldOutField">

            <span>
              売り切れ
            </span>

            <input
              type="checkbox"
              id="menuSoldOut"
            >

          </label>


          <label class="switch-row">

            <span>
              公開する
            </span>

            <input
              type="checkbox"
              id="menuVisible"
              checked
            >

          </label>

        </div>

      </div>

      <div class="modal-actions">

        <button
          type="button"
          id="deleteMenuButton"
          class="danger-action"
          hidden
        >
          削除
        </button>

        <button
          type="button"
          id="saveMenuButton"
          class="primary-action"
        >
          保存する
        </button>

      </div>

    </section>

  </div>


  <!-- =========================
       お知らせ編集モーダル
  ========================== -->

  <div
    class="modal"
    id="newsModal"
    aria-hidden="true"
  >

    <div
      class="modal-backdrop"
      data-close-modal="newsModal"
    ></div>

    <section
      class="modal-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="newsModalTitle"
    >

      <div class="modal-header">

        <div>

          <p class="modal-label">
            NEWS
          </p>

          <h2 id="newsModalTitle">
            お知らせを追加
          </h2>

        </div>

        <button
          type="button"
          class="modal-close"
          data-close-modal="newsModal"
        >
          ×
        </button>

      </div>

      <input
        type="hidden"
        id="newsEditId"
      >

      <div class="form-stack">

        <label>

          タイトル

          <input
            type="text"
            id="newsTitle"
            placeholder="お知らせタイトル"
          >

        </label>


        <label>

          内容

          <textarea
            id="newsContent"
            placeholder="お知らせの内容"
          ></textarea>

        </label>


        <label class="file-label">

          写真

          <input
            type="file"
            id="newsImage"
            accept="image/*"
          >

        </label>

      </div>

      <div class="modal-actions">

        <button
          type="button"
          id="deleteNewsButton"
          class="danger-action"
          hidden
        >
          削除
        </button>

        <button
          type="button"
          id="saveNewsButton"
          class="primary-action"
        >
          公開する
        </button>

      </div>

    </section>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="editor.js?v=5"></script>

</body>
</html>
