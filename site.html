<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>たけのこレストラン</title>
  <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="site.css">
</head>

<body>

  <nav class="site-nav">
  <div class="site-nav-inner">
    <a href="#" class="site-logo" id="siteNavCompanyName">店舗名</a>

    <div class="site-nav-links">
      <a href="#menu">メニュー</a>
      <a href="#company">店舗情報</a>
      <a href="#access">アクセス</a>
      <a href="#news">お知らせ</a>
    </div>
  </div>
</nav>

  <header class="hero">
  <div class="hero-overlay">
    <h1 id="siteCompanyName">会社名</h1>
    <p id="siteAddress">住所</p>
  </div>
</header>

  <main>

    <section>
  <h2>店舗紹介</h2>
  <p id="siteDescription"></p>
</section>

<section>
  <section id="menu">
  <div id="siteMenuList"></div>
</section>

<section>
  <section id="company">

      <p>
        <strong>電話番号：</strong>
        <span id="sitePhone"></span>
      </p>

      <p>
        <strong>営業時間：</strong>
        <span id="siteHours"></span>
      </p>

      <p>
        <strong>定休日：</strong>
        <span id="siteClosedDays"></span>
      </p>
    </section>

    <section>
  <section id="access">

  <div class="map-wrap">
    <iframe
      id="siteMap"
      width="100%"
      height="350"
      style="border:0;"
      loading="lazy"
      allowfullscreen
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>
</section>

<section>
  <h2>お問い合わせ</h2>

  <div class="contact-links">
    <a id="phoneLink" class="contact-button" href="#">
      電話する
    </a>

    <a id="instagramLink" class="contact-button" href="#" target="_blank">
      Instagram
    </a>
  </div>
</section>

    <section>
      <section id="news">>
      <div id="siteNewsList"></div>
    </section>

  </main>

  <footer class="site-footer">
  <div class="footer-inner">
    <h2 id="footerCompanyName">店舗名</h2>

    <p id="footerAddress"></p>

    <p>
      <span id="footerHours"></span>
      <span id="footerClosedDays"></span>
    </p>

    <div class="footer-links">
      <a id="footerInstagram" href="#" target="_blank">Instagram</a>
    </div>

    <p class="copyright">
      © <span id="footerYear"></span> <span id="footerCompanyNameCopy"></span>
    </p>
  </div>
</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="site.js"></script>

</body>
</html>
